apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-mgt-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-mgt-api
  template:
    metadata:
      labels:
        app: task-mgt-api
    spec:
        containers:
        - name: task-mgt-api
          image: ogdev1/task-mgt-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: task-mgt-api-config
            - secretRef:
                name: task-mgt-api-secret
